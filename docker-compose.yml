version: '3.8'

services:
  # 0xSCADA Main Application
  scada-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scada-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/scada_db
      - REDIS_URL=redis://redis:6379
      - BLOCKCHAIN_RPC_URL=http://hardhat:8545
      - ENABLE_API_KEYS=${ENABLE_API_KEYS:-true}
      - API_KEYS_FILE=/run/secrets/api_keys
      - OXSCADA_REPLICA_COUNT=1
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hardhat:
        condition: service_started
    networks:
      - scada-network
    volumes:
      - scada-data:/app/data
    secrets:
      - api_keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: scada-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=scada_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - scada-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scada_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: scada-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - scada-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Hardhat Local Blockchain (Development)
  hardhat:
    # hardhat 3.x refuses to start below Node 22.13.0 (its CLI aborts with
    # "not supported by Hardhat"), so this must stay on the 22 line.
    image: node:22-alpine
    container_name: scada-hardhat
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install hardhat && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"
    volumes:
      - ./hardhat.config.ts:/app/hardhat.config.ts
      - ./contracts:/app/contracts
      - ./package.json:/app/package.json
      - hardhat-data:/app/cache
    networks:
      - scada-network
    environment:
      - NODE_ENV=development

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: scada-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - scada-network
    depends_on:
      - scada-app

  # Grafana Dashboard
  grafana:
    image: grafana/grafana-oss:latest
    container_name: scada-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - scada-network
    depends_on:
      - prometheus

networks:
  scada-network:
    driver: bridge
    name: scada-network

volumes:
  postgres-data:
    name: scada-postgres-data
  redis-data:
    name: scada-redis-data
  hardhat-data:
    name: scada-hardhat-data
  prometheus-data:
    name: scada-prometheus-data
  grafana-data:
    name: scada-grafana-data
  scada-data:
    name: scada-app-data

secrets:
  api_keys:
    file: ${API_KEYS_FILE:?Set API_KEYS_FILE to a bootstrap API-key secret file}
