openapi: 3.0.3
info:
  title: 0xSCADA REST API
  description: |
    Industrial SCADA platform REST API. Read-heavy endpoints for assets, tags,
    and alarms with pagination, filtering, and sorting.
    
    ## Pagination
    All list endpoints support:
    - `page` (default: 1)
    - `limit` (default: 25, max: 100)
    - `sort_by` (field name)
    - `sort_order` (asc|desc, default: desc)
    
    Responses include `pagination` metadata and HATEOAS `_links`.
    
    ## Rate Limits
    - Read endpoints: 100 req/min per client
    - Write endpoints: 30 req/min per client
    - WebSocket connections: 10 per client
  version: 1.0.0
  contact:
    name: 0xSCADA Team
    url: https://github.com/NickFlach/0xSCADA

servers:
  - url: /api
    description: API base path

components:
  schemas:
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNext: { type: boolean }
        hasPrev: { type: boolean }

    Links:
      type: object
      properties:
        self: { type: string }
        first: { type: string }
        last: { type: string }
        next: { type: string, nullable: true }
        prev: { type: string, nullable: true }

    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string }
        assetType: { type: string }
        nameOrTag: { type: string }
        critical: { type: boolean }
        metadata: { type: object }
        status: { type: string, enum: [OK, WARNING, ALARM, OFFLINE] }
        createdAt: { type: string, format: date-time }

    Tag:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        unit: { type: string }
        scanRate: { type: integer }
        deadband: { type: number }
        alarmConfig:
          type: object
          properties:
            highHigh: { type: number }
            high: { type: number }
            low: { type: number }
            lowLow: { type: number }
        currentValue:
          type: object
          nullable: true
          properties:
            value: { type: number }
            quality: { type: string }
            timestamp: { type: string, format: date-time }

    ActiveAlarm:
      type: object
      properties:
        id: { type: string }
        tag: { type: string }
        assetId: { type: string }
        severity: { type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL] }
        state: { type: string, enum: [ACTIVE, ACKNOWLEDGED, CLEARED, SHELVED] }
        message: { type: string }
        value: { type: number }
        threshold: { type: number }
        activatedAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        clearedAt: { type: string, format: date-time, nullable: true }

    AlarmSummary:
      type: object
      properties:
        total: { type: integer }
        bySeverity:
          type: object
          properties:
            CRITICAL: { type: integer }
            HIGH: { type: integer }
            MEDIUM: { type: integer }
            LOW: { type: integer }
            INFO: { type: integer }
        byState:
          type: object
          properties:
            ACTIVE: { type: integer }
            ACKNOWLEDGED: { type: integer }
            CLEARED: { type: integer }
            SHELVED: { type: integer }

    Error:
      type: object
      properties:
        error: { type: string }

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
    SortByParam:
      name: sort_by
      in: query
      schema: { type: string }
    SortOrderParam:
      name: sort_order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }

paths:
  /assets:
    get:
      summary: List assets
      tags: [Assets]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - name: site_id
          in: query
          schema: { type: string }
        - name: asset_type
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: critical
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string }
          description: Partial match on nameOrTag
      responses:
        '200':
          description: Paginated asset list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Asset' }
                  pagination: { $ref: '#/components/schemas/PaginationMeta' }
                  _links: { $ref: '#/components/schemas/Links' }
    post:
      summary: Create asset
      tags: [Assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteId, assetType, nameOrTag]
              properties:
                siteId: { type: string }
                assetType: { type: string }
                nameOrTag: { type: string }
                critical: { type: boolean }
                metadata: { type: object }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /assets/{id}:
    get:
      summary: Get asset by ID
      tags: [Assets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      summary: Update asset
      tags: [Assets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
                critical: { type: boolean }
                metadata: { type: object }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
    delete:
      summary: Delete asset
      tags: [Assets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted

  /tags:
    get:
      summary: List tags with current values
      tags: [Tags]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - name: search
          in: query
          schema: { type: string }
          description: Partial match on tag name
        - name: unit
          in: query
          schema: { type: string }
        - name: has_value
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated tag list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
                  pagination: { $ref: '#/components/schemas/PaginationMeta' }
                  _links: { $ref: '#/components/schemas/Links' }

  /tags/{name}:
    get:
      summary: Get current value of a tag
      tags: [Tags]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alarms/active:
    get:
      summary: List active alarms
      tags: [Alarms]
      parameters:
        - name: severity
          in: query
          schema: { type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL] }
        - name: state
          in: query
          schema: { type: string, enum: [ACTIVE, ACKNOWLEDGED, CLEARED, SHELVED] }
        - name: tag
          in: query
          schema: { type: string }
          description: Partial match on tag name
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ActiveAlarm' }
                  total: { type: integer }

  /alarms/history:
    get:
      summary: Historical alarm events (paginated)
      tags: [Alarms]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: severity
          in: query
          schema: { type: string }
        - name: asset_id
          in: query
          schema: { type: string }
        - name: site_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated alarm history

  /alarms/summary:
    get:
      summary: Alarm counts by severity and state
      tags: [Alarms]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlarmSummary' }

  /alarms/{id}/acknowledge:
    post:
      summary: Acknowledge an alarm
      tags: [Alarms]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveAlarm' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alarms/{id}/clear:
    post:
      summary: Clear an alarm
      tags: [Alarms]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveAlarm' }

  /health:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: Service health status
