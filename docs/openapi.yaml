        - name: aasId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmodelRequest'
      responses:
        '201':
          description: Submodel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AASSubmodel'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/aas/sync:
    post:
      tags: [AAS]
      summary: Sync all AAS
      operationId: syncAllAAS
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AASSyncResult'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/aas/templates:
    get:
      tags: [AAS]
      summary: List submodel templates
      operationId: getSubmodelTemplates
      responses:
        '200':
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmodelTemplate'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # TAGS (Real-time Subscription)
  # ============================================================================
  /api/tags:
    get:
      tags: [Tags]
      summary: List registered tags with current values
      operationId: getTags
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagWithValue'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tags/{name}:
    get:
      tags: [Tags]
      summary: Get tag value
      operationId: getTagValue
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tag value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagValue'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tags/{name}/write:
    post:
      tags: [Tags]
      summary: Write value to tag
      operationId: writeTagValue
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  oneOf:
                    - type: number
                    - type: boolean
      responses:
        '200':
          description: Write result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagWriteResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tags/register:
    post:
      tags: [Tags]
      summary: Register tags to monitor
      operationId: registerTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/TagConfig'
      responses:
        '200':
          description: Tags registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  registered:
                    type: integer
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/tags/service/status:
    get:
      tags: [Tags]
      summary: Get tag service status
      operationId: getTagServiceStatus
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagServiceStatus'

  /api/tags/connect:
    post:
      tags: [Tags]
      summary: Connect to Modbus device
      operationId: connectTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host:
                  type: string
                port:
                  type: integer
                  default: 5020
      responses:
        '200':
          description: Connection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    $ref: '#/components/schemas/TagServiceStatus'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tags/disconnect:
    post:
      tags: [Tags]
      summary: Disconnect from Modbus device
      operationId: disconnectTags
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # ============================================================================
  # WEBSOCKET MANAGEMENT
  # ============================================================================
  /api/ws/health:
    get:
      tags: [WebSocket]
      summary: WebSocket server health
      operationId: getWSHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: number
                  connections:
                    type: integer
        '503':
          description: Unhealthy

  /api/ws/metrics:
    get:
      tags: [WebSocket]
      summary: Get WebSocket metrics
      operationId: getWSMetrics
      responses:
        '200':
          description: WebSocket metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketMetrics'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/ws/clients:
    get:
      tags: [WebSocket]
      summary: List connected clients
      operationId: getWSClients
      responses:
        '200':
          description: Connected clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  clients:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebSocketClient'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/ws/clients/{clientId}:
    delete:
      tags: [WebSocket]
      summary: Disconnect client
      operationId: disconnectWSClient
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: reason
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Client disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

# ============================================================================
# COMPONENTS
# ============================================================================
components:
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # Common
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object

    # Health
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        uptime:
          type: number
        components:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  enum: [up, down]
                latencyMs:
                  type: number
            blockchain:
              type: object
              properties:
                status:
                  type: string
                  enum: [up, down, unknown]

    # Enums
    EventType:
      type: string
      enum: [TELEMETRY, ALARM, COMMAND, ACKNOWLEDGEMENT, MAINTENANCE, BLUEPRINT_CHANGE, CODE_GENERATION, DEPLOYMENT_INTENT]

    OriginType:
      type: string
      enum: [GATEWAY, USER, AGENT, SYSTEM]

    AnchorStatus:
      type: string
      enum: [PENDING, BATCHED, ANCHORED, FAILED]

    # Sites
    Site:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        owner:
          type: string
        status:
          type: string
        ethereumAddress:
          type: string
        authorizedGateways:
          type: array
          items:
            type: string
        authorizedSigners:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSiteRequest:
      type: object
      required: [name, location, owner]
      properties:
        name:
          type: string
        location:
          type: string
        owner:
          type: string
        ethereumAddress:
          type: string
        authorizedGateways:
          type: array
          items:
            type: string
        authorizedSigners:
          type: array
          items:
            type: string

    # Assets
    Asset:
      type: object
      properties:
        id:
          type: string
        siteId:
          type: string
        assetType:
          type: string
        nameOrTag:
          type: string
        critical:
          type: boolean
        metadata:
          type: object
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateAssetRequest:
      type: object
      required: [siteId, assetType, nameOrTag]
      properties:
        siteId:
          type: string
        assetType:
          type: string
        nameOrTag:
          type: string
        critical:
          type: boolean
          default: false
        metadata:
          type: object

    # Events (Legacy)
    EventAnchor:
      type: object
      properties:
        id:
          type: string
        assetId:
          type: string
        eventType:
          type: string
        payloadHash:
          type: string
        timestamp:
          type: string
          format: date-time
        recordedBy:
          type: string
        txHash:
          type: string
        details:
          type: string
        fullPayload:
          type: object

    PaginatedEvents:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventAnchor'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean
        nextPage:
          type: integer
          nullable: true
        prevPage:
          type: integer
          nullable: true

    CreateEventRequest:
      type: object
      required: [assetId, eventType, payload]
      properties:
        assetId:
          type: string
        eventType:
          type: string
        payload:
          type: object
        details:
          type: string
        recordedBy:
          type: string

    # Events v2
    EventV2:
      type: object
      properties:
        id:
          type: string
        eventType:
          $ref: '#/components/schemas/EventType'
        siteId:
          type: string
        assetId:
          type: string
        sourceTimestamp:
          type: string
          format: date-time
        receiptTimestamp:
          type: string
          format: date-time
        originType:
          $ref: '#/components/schemas/OriginType'
        originId:
          type: string
        payload:
          type: object
        details:
          type: string
        signature:
          type: string
        hash:
          type: string
        anchorStatus:
          $ref: '#/components/schemas/AnchorStatus'
        batchId:
          type: string
        merkleIndex:
          type: integer
        merkleProof:
          type: array
          items:
            type: string
        anchorTxHash:
          type: string
        anchoredAt:
          type: string
          format: date-time

    EventsV2Response:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventV2'
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            count:
              type: integer

    EventV2Detail:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/EventV2'
        batch:
          $ref: '#/components/schemas/EventBatch'
        verification:
          type: object
          properties:
            hash:
              type: string
            signature:
              type: string
            anchorStatus:
              $ref: '#/components/schemas/AnchorStatus'
            merkleProof:
              type: array
              items:
                type: string
            anchorTxHash:
              type: string

    EventVerification:
      type: object
      properties:
        eventId:
          type: string
        valid:
          type: boolean
        computedHash:
          type: string
        storedHash:
          type: string
        merkleRoot:
          type: string
        anchorTxHash:
          type: string
        anchoredAt:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            hashValid:
              type: boolean
            signaturePresent:
              type: boolean
            merkleProofValid:
              type: boolean
            anchored:
              type: boolean

    CreateEventV2Request:
      type: object
      required: [eventType, siteId, originType, originId, payload]
      properties:
        eventType:
          $ref: '#/components/schemas/EventType'
        siteId:
          type: string
        assetId:
          type: string
        originType:
          $ref: '#/components/schemas/OriginType'
        originId:
          type: string
        payload:
          type: object
        sourceTimestamp:
          type: string
          format: date-time
        details:
          type: string

    CreateTelemetryEventRequest:
      type: object
      required: [siteId, assetId, originId, tag, value]
      properties:
        siteId:
          type: string
        assetId:
          type: string
        originId:
          type: string
        originType:
          $ref: '#/components/schemas/OriginType'
          default: GATEWAY
        tag:
          type: string
        value:
          oneOf:
            - type: number
            - type: string
        unit:
          type: string
        quality:
          type: string
          default: GOOD

    CreateAlarmEventRequest:
      type: object
      required: [siteId, assetId, originId, alarmId, severity, state, message]
      properties:
        siteId:
          type: string
        assetId:
          type: string
        originId:
          type: string
        originType:
          $ref: '#/components/schemas/OriginType'
        alarmId:
          type: string
        alarmType:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        state:
          type: string
          enum: [ACTIVE, CLEARED, ACKNOWLEDGED]
        message:
          type: string
        value:
          type: number
        limit:
          type: number

    CreateCommandEventRequest:
      type: object
      required: [siteId, assetId, originId, commandType, target]
      properties:
        siteId:
          type: string
        assetId:
          type: string
        originId:
          type: string
        originType:
          $ref: '#/components/schemas/OriginType'
          default: USER
        commandType:
          type: string
        target:
          type: string
        value:
          type: string
        previousValue:
          type: string
        reason:
          type: string

    EventStats:
      type: object
      properties:
        total:
          type: integer
        byType:
          type: object
          additionalProperties:
            type: integer
        byOrigin:
          type: object
          additionalProperties:
            type: integer
        byAnchorStatus:
          type: object
          additionalProperties:
            type: integer
        recentActivity:
          type: object
          properties:
            last24h:
              type: integer
            lastWeek:
              type: integer

    EventTypesMetadata:
      type: object
      properties:
        types:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              description:
                type: string
        origins:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              description:
                type: string
        anchorStatuses:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              description:
                type: string

    # Event Batches
    EventBatch:
      type: object
      properties:
        id:
          type: string
        siteId:
          type: string
        eventCount:
          type: integer
        merkleRoot:
          type: string
        firstEventAt:
          type: string
          format: date-time
        lastEventAt:
          type: string
          format: date-time
        anchorStatus:
          $ref: '#/components/schemas/AnchorStatus'
        txHash:
          type: string
        blockNumber:
          type: integer
        anchoredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    BatchDetail:
      type: object
      properties:
        batch:
          $ref: '#/components/schemas/EventBatch'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventV2'
        verification:
          type: object
          properties:
            merkleRoot:
              type: string
            eventCount:
              type: integer
            anchorStatus:
              $ref: '#/components/schemas/AnchorStatus'
            txHash:
              type: string
            blockNumber:
              type: integer

    AnchorResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        txHash:
          type: string
        blockNumber:
          type: integer
        anchoredAt:
          type: string
          format: date-time

    # Batch Anchoring
    BatchStats:
      type: object
      properties:
        stats:
          type: object
        config:
          type: object
        blobConfig:
          type: object
        blockchain:
          type: object
          properties:
            enabled:
              type: boolean
            gasPrice:
              type: string

    BatchHistoryItem:
      type: object
      properties:
        batchId:
          type: string
        eventCount:
          type: integer
        merkleRoot:
          type: string
        txHash:
          type: string
        timestamp:
          type: string
          format: date-time

    PendingEvents:
      type: object
      properties:
        count:
          type: integer
        events:
          type: array
          items:
            type: object

    FlushResult:
      type: object
      properties:
        success:
          type: boolean
        batch:
          type: object
        message:
          type: string

    MerkleProof:
      type: object
      properties:
        eventId:
          type: string
        eventHash:
          type: string
        merkleRoot:
          type: string
        proof:
          type: array
          items:
            type: string
        index:
          type: integer

    BatchConfigUpdate:
      type: object
      properties:
        maxBatchSize:
          type: integer
        maxBatchAgeMs:
          type: integer
        enabled:
          type: boolean

    BatchConfigResponse:
      type: object
      properties:
        success:
          type: boolean
        config:
          type: object

    BlobConfig:
      type: object
      properties:
        enabled:
          type: boolean
        compressionEnabled:
          type: boolean

    BlobConfigUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        compressionEnabled:
          type: boolean

    BlobConfigResponse:
      type: object
      properties:
        success:
          type: boolean
        config:
          $ref: '#/components/schemas/BlobConfig'

    BlobCostEstimate:
      type: object
      properties:
        eventCount:
          type: integer
        gasPrice:
          type: string
        blobCost:
          type: string
        calldataCost:
          type: string
        savings:
          type: number

    # Maintenance
    MaintenanceRecord:
      type: object
      properties:
        id:
          type: string
        assetId:
          type: string
        workOrderId:
          type: string
        performedBy:
          type: string
        maintenanceType:
          type: string
        performedAt:
          type: string
          format: date-time
        nextDueAt:
          type: string
          format: date-time
        notes:
          type: string
        attachmentHash:
          type: string

    CreateMaintenanceRecordRequest:
      type: object
      required: [assetId, workOrderId, performedBy, maintenanceType, performedAt]
      properties:
        assetId:
          type: string
        workOrderId:
          type: string
        performedBy:
          type: string
        maintenanceType:
          type: string
        performedAt:
          type: string
          format: date-time
        nextDueAt:
          type: string
          format: date-time
        notes:
          type: string
        attachmentHash:
          type: string

    # Blueprints
    BlueprintsSummary:
      type: object
      properties:
        controlModuleTypes:
          type: integer
        controlModuleInstances:
          type: integer
        unitTypes:
          type: integer
        unitInstances:
          type: integer
        phaseTypes:
          type: integer
        phaseInstances:
          type: integer
        vendors:
          type: integer

    BlueprintImportRequest:
      type: object
      required: [cmTypePackage, designSpec]
      properties:
        cmTypePackage:
          type: string
        designSpec:
          type: string

    BlueprintImportResult:
      type: object
      properties:
        success:
          type: boolean
        imported:
          type: object
          properties:
            cmTypes:
              type: integer
            cmInstances:
              type: integer
            unitTypes:
              type: integer
            unitInstances:
              type: integer
            phaseTypes:
              type: integer
        warnings:
          type: array
          items:
            type: string

    SeedResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        skipped:
          type: boolean

    ControlModuleType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        vendorId:
          type: string
        version:
          type: string
        description:
          type: string
        inputs:
          type: array
          items:
            type: object
        outputs:
          type: array
          items:
            type: object
        inOuts:
          type: array
          items:
            type: object
        sourcePackage:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateCMTypeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        vendorId:
          type: string
        version:
          type: string
        description:
          type: string
        inputs:
          type: array
          items:
            type: object
        outputs:
          type: array
          items:
            type: object
        inOuts:
          type: array
          items:
            type: object

    ControlModuleInstance:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        instanceNumber:
          type: integer
        controlModuleTypeId:
          type: string
        controllerId:
          type: string
        unitInstanceId:
          type: string
        pidDrawing:
          type: string
        comment:
          type: string
        configuration:
          type: object
        currentState:
          type: object
        createdAt:
          type: string
          format: date-time

    UnitType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        vendorId:
          type: string
        version:
          type: string
        description:
          type: string
        variables:
          type: array
          items:
            type: object
        equipmentModules:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time

    CreateUnitTypeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        variables:
          type: array
          items:
            type: object
        equipmentModules:
          type: array
          items:
            type: object

    UnitInstance:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        instanceNumber:
          type: integer
        unitTypeId:
          type: string
        controllerId:
          type: string
        pidDrawing:
          type: string
        processCell:
          type: string
        area:
          type: string
        comment:
          type: string
        siteId:
          type: string
        createdAt:
          type: string
          format: date-time

    PhaseType:
