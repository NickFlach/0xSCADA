  /api/batch/blob/estimate:
    post:
      tags: [Batch]
      summary: Estimate blob vs calldata costs
      operationId: estimateBlobCost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventCount]
              properties:
                eventCount:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Cost estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobCostEstimate'
        '400':
          $ref: '#/components/responses/ValidationError'
