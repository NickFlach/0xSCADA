  /api/batch/history:
    get:
      tags: [Batch]
      summary: Get batch history
      operationId: getBatchHistory
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Recent batch history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchHistoryItem'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/batch/pending:
    get:
      tags: [Batch]
      summary: Get pending events
      operationId: getPendingEvents
      responses:
        '200':
          description: Pending events in queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingEvents'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/batch/flush:
    post:
      tags: [Batch]
      summary: Force flush pending events
      operationId: flushBatch
      responses:
        '200':
          description: Flush result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlushResult'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/batch/{batchId}/proof/{eventId}:
    get:
      tags: [Batch]
      summary: Get Merkle proof for event
      operationId: getEventProof
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Merkle proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerkleProof'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/batch/config:
    put:
      tags: [Batch]
      summary: Update batch configuration
      operationId: updateBatchConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchConfigUpdate'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
