openapi: 3.0.3
info:
  title: 0xSCADA Industrial Control Fabric API
  description: |
    # 0xSCADA API Documentation

    **Decentralized Industrial Control Fabric** - Where Atoms Meet Bits

    This API provides endpoints for managing industrial assets, events, code generation,
    and blockchain anchoring for tamper-evident audit trails.

    ## Key Features
    - **Site & Asset Management**: Register and manage industrial sites and assets
    - **Event Anchoring**: Immutable event logging with Ethereum blockchain anchoring
    - **Batch Anchoring**: Merkle tree batching for high-volume events (95-99% gas savings)
    - **Blueprints Engine**: ISA-88 batch control module management
    - **Code Generation**: Multi-vendor PLC code generation (Siemens SCL, Rockwell L5X)
    - **Agent Framework**: AI-driven operational agents with human-in-the-loop governance
    - **Digital Twin (AAS)**: Asset Administration Shell per IEC 63278
    - **Ubiquity Integration**: Remote device management via Rockwell FactoryTalk

    ## Authentication
    Currently, the API does not require authentication for development.
    Production deployments should implement role-based access control.

    ## WebSocket Support
    Real-time data streaming is available via WebSocket connections for:
    - Tag value updates (`/api/tags/ws`)
    - Event notifications (`/api/ws`)

  version: 2.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: The ESCO Group
    url: https://github.com/The-ESCO-Group/0xSCADA

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Health
    description: System health and status endpoints
  - name: Sites
    description: Industrial site management
  - name: Assets
    description: Asset registration and tracking
  - name: Events
    description: Event logging and querying (legacy)
  - name: Events v2
    description: Enhanced event API with full anchoring support
  - name: Batch
    description: Merkle batch anchoring system
  - name: Maintenance
    description: Maintenance record management
  - name: Blockchain
    description: Blockchain connectivity status
  - name: Blueprints
    description: ISA-88 control module blueprints
  - name: Vendors
    description: PLC vendor configurations
  - name: Templates
    description: Code generation templates
  - name: Controllers
    description: PLC/DCS controller definitions
  - name: Code Generation
    description: Multi-vendor code generation
  - name: Ladder Logic
    description: Rockwell ladder logic generation
  - name: Agents
    description: AI agent framework
  - name: AAS
    description: Asset Administration Shell (Digital Twin)
  - name: Ubiquity
    description: Rockwell Ubiquity cloud integration
  - name: Tags
    description: Real-time tag subscription service
  - name: WebSocket
    description: WebSocket server management

  - name: Tuning
    description: Human-gated PID auto-tuning (ADR-0013 [13.4], issue #215) — loop registry, simulation-based tuning studies, approval gate, durable audit trail
  - name: Marketplace
    description: Agent marketplace (ADR-0013 [13.6], issue #217) — plugin registry, install lifecycle, capability grants, invocation
  - name: Intelligence
    description: Natural-language query (ADR-0013 [13.5], issue #216) plus the retired legacy intelligence surface (410/501 refusal envelope)
paths:
  # ============================================================================
  # HEALTH
  # ============================================================================
  /api/health:
    get:
      tags: [Health]
      summary: System health check
      description: Returns health status of database, blockchain, and other components
      operationId: getHealth
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ============================================================================
  # SITES
  # ============================================================================
  /api/sites:
    get:
      tags: [Sites]
      summary: List all sites
      operationId: getSites
      responses:
        '200':
          description: List of industrial sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Sites]
      summary: Create a new site
      operationId: createSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Site created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # ASSETS
  # ============================================================================
  /api/assets:
    get:
      tags: [Assets]
      summary: List all assets
      operationId: getAssets
      responses:
        '200':
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Assets]
      summary: Create a new asset
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
      responses:
        '201':
          description: Asset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/assets/site/{siteId}:
    get:
      tags: [Assets]
      summary: Get assets by site
      operationId: getAssetsBySite
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of assets for the site
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # EVENTS (Legacy)
  # ============================================================================
  /api/events:
    get:
      tags: [Events]
      summary: List events with pagination
      operationId: getEvents
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvents'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Events]
      summary: Create and anchor a new event
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created and anchored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAnchor'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # EVENTS V2 (Enhanced)
  # ============================================================================
  /api/v2/events:
    get:
      tags: [Events v2]
      summary: Query events with filtering
      operationId: getEventsV2
      parameters:
        - name: siteId
          in: query
          schema:
            type: string
        - name: assetId
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            $ref: '#/components/schemas/EventType'
        - name: originType
          in: query
          schema:
            $ref: '#/components/schemas/OriginType'
        - name: anchorStatus
          in: query
          schema:
            $ref: '#/components/schemas/AnchorStatus'
        - name: startTime
          in: query
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Filtered list of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsV2Response'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Events v2]
      summary: Create a signed event
      operationId: createEventV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventV2Request'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventV2'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/events/{id}:
    get:
      tags: [Events v2]
      summary: Get event by ID
      operationId: getEventById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event details with batch info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventV2Detail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/events/{id}/verify:
    get:
      tags: [Events v2]
      summary: Verify event integrity
      operationId: verifyEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventVerification'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/events/telemetry:
    post:
      tags: [Events v2]
      summary: Create telemetry event
      operationId: createTelemetryEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTelemetryEventRequest'
      responses:
        '201':
          description: Telemetry event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventV2'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/events/alarm:
    post:
      tags: [Events v2]
      summary: Create alarm event
      operationId: createAlarmEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlarmEventRequest'
      responses:
        '201':
          description: Alarm event created
          content:
