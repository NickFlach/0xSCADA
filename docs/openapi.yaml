        globalId:
          type: string
        semanticIdType:
          type: string
        semanticIdValue:
          type: string
        submodelType:
          type: string
        displayName:
          type: string
        description:
          type: string
        version:
          type: string
          default: "1.0.0"
        kind:
          type: string
          default: Instance
        qualifiers:
          type: array
          items:
            type: object

    AASSyncResult:
      type: object
      properties:
        message:
          type: string
        synced:
          type: object

    SubmodelTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        submodelType:
          type: string
        displayName:
          type: string
        description:
          type: string
        semanticIdType:
          type: string
        semanticIdValue:
          type: string
        elementDefinitions:
          type: array
          items:
            type: object
        applicableAssetTypes:
          type: array
          items:
            type: string
        version:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # Tags
    TagWithValue:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        unit:
          type: string
        scanRate:
          type: integer
        deadband:
          type: number
        alarmConfig:
          type: object
          properties:
            highHigh:
              type: number
            high:
              type: number
            low:
              type: number
            lowLow:
              type: number
        currentValue:
          type: object
          nullable: true
          properties:
            value:
              oneOf:
                - type: number
                - type: boolean
            quality:
              type: string
            timestamp:
              type: string
              format: date-time

    TagValue:
      type: object
      properties:
        tag:
          type: string
        value:
          oneOf:
            - type: number
            - type: boolean
        quality:
          type: string
        timestamp:
          type: string
          format: date-time
        unit:
          type: string

    TagWriteResult:
      type: object
      properties:
        success:
          type: boolean
        tag:
          type: string
        value:
          oneOf:
            - type: number
            - type: boolean

    TagConfig:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
        address:
          type: string
        unit:
          type: string
        scanRate:
          type: integer
        deadband:
          type: number
        alarmConfig:
          type: object
          properties:
            highHigh:
              type: number
            high:
              type: number
            low:
              type: number
            lowLow:
              type: number

    TagServiceStatus:
      type: object
      properties:
        connected:
          type: boolean
        registeredTags:
          type: integer
        wsClients:
          type: integer
        subscriptions:
          type: integer
        driver:
          type: object
          nullable: true

    # WebSocket
    WebSocketMetrics:
      type: object
      properties:
        success:
          type: boolean
        metrics:
          type: object
          properties:
            connections:
              type: object
              properties:
                active:
                  type: integer
                total:
                  type: integer
                authenticated:
                  type: integer
            subscriptions:
              type: object
              properties:
                total:
                  type: integer
            messages:
              type: object
              properties:
                received:
                  type: integer
                sent:
                  type: integer
                eventsDelivered:
                  type: integer
            errors:
              type: integer
            uptime:
              type: number
            startTime:
              type: string
              format: date-time

    WebSocketClient:
      type: object
      properties:
        id:
          type: string
        connectedAt:
          type: string
          format: date-time
        authenticated:
          type: boolean
        subscriptions:
          type: array
          items:
            type: string

    # ── #54: Tuning / Marketplace / Intelligence schemas ─────────────────────
    TuningGains:
      type: object
      required: [kp, ki, kd]
      additionalProperties: false
      properties:
        kp:
          type: number
          minimum: 0
        ki:
          type: number
          minimum: 0
        kd:
          type: number
          minimum: 0
    TuningRange:
      type: object
      required: [min, max]
      additionalProperties: false
      description: min must not exceed max
      properties:
        min:
          type: number
          minimum: 0
        max:
          type: number
    TuningEnvelope:
      type: object
      required: [kpRange, kiRange, kdRange]
      additionalProperties: false
      properties:
        kpRange:
          $ref: '#/components/schemas/TuningRange'
        kiRange:
          $ref: '#/components/schemas/TuningRange'
        kdRange:
          $ref: '#/components/schemas/TuningRange'
    TuningLoopRegistration:
      type: object
      required: [id, name, gains, setpoint, outputMin, outputMax]
      additionalProperties: false
      description: outputMin must be below outputMax
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 256
        gains:
          $ref: '#/components/schemas/TuningGains'
        setpoint:
          type: number
        outputMin:
          type: number
        outputMax:
          type: number
        maxGainChangeFraction:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        sampleTime:
          type: number
          exclusiveMinimum: 0
        envelope:
          $ref: '#/components/schemas/TuningEnvelope'
    TuningLoopSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        gains:
          $ref: '#/components/schemas/TuningGains'
        setpoint:
          type: number
        envelope:
          $ref: '#/components/schemas/TuningEnvelope'
    TuningLoopDetail:
      allOf:
        - $ref: '#/components/schemas/TuningLoopSummary'
        - type: object
          properties:
            metrics:
              type: object
              description: PID performance metrics (ISE/IAE/ITAE, overshoot, settling, oscillation)
              additionalProperties: true
    TuningProcessModel:
      type: object
      required: [gain, timeConstantS, deadTimeS]
      additionalProperties: false
      properties:
        gain:
          type: number
          description: Non-zero process gain
        timeConstantS:
          type: number
          exclusiveMinimum: 0
          maximum: 86400
        deadTimeS:
          type: number
          minimum: 0
          maximum: 3600
        noiseSigma:
          type: number
          minimum: 0
    TuningRelayRequest:
      type: object
      required: [model]
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/TuningProcessModel'
        relayAmplitude:
          type: number
          exclusiveMinimum: 0
        hysteresis:
          type: number
          exclusiveMinimum: 0
        minCycles:
          type: integer
          minimum: 2
          maximum: 20
        dtS:
          type: number
          exclusiveMinimum: 0
          maximum: 60
    TuningCohenCoonRequest:
      type: object
      required: [model]
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/TuningProcessModel'
    TuningRLRequest:
      type: object
      required: [model]
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/TuningProcessModel'
        config:
          type: object
          additionalProperties: false
          description: All fields optional (partial)
          properties:
            episodes:
              type: integer
              minimum: 1
              maximum: 500
            episodeTicks:
              type: integer
              minimum: 10
              maximum: 10000
            dtS:
              type: number
              exclusiveMinimum: 0
              maximum: 60
            epsilon:
              type: number
              minimum: 0
              maximum: 1
            epsilonDecay:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            learningRate:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            discount:
              type: number
              minimum: 0
              maximum: 1
            overshootPenalty:
              type: number
              minimum: 0
            oscillationPenalty:
              type: number
              minimum: 0
            seed:
              type: integer
    TuningDecision:
      type: object
      additionalProperties: false
      description: |
        Strict — a caller-supplied `approver` field is rejected with 400. The
        approver identity is always the authenticated control-plane principal.
      properties:
        comment:
          type: string
          maxLength: 2000
    TuningProposal:
      type: object
      description: Approval-gated tuning proposal (shared/types/tuning)
      additionalProperties: true
    TuningError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        reason:
          type: string
          description: Machine-readable reason (e.g. envelope-violation, loop-already-registered, approval-gate-unconfigured, audit-store-unavailable)
    MarketplaceManifest:
      type: object
      required: [id, name, version, category]
      additionalProperties: false
      description: Strict — a body carrying a `publisher` field is rejected with 400.
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 256
        version:
          type: string
          pattern: '^v?\\d+\\.\\d+\\.\\d+$'
        description:
          type: string
          maxLength: 2000
        author:
          type: string
          maxLength: 256
        category:
          type: string
          enum: [intelligence, integration, reporting, safety, optimization, custom]
        requiredCapabilities:
          type: array
          maxItems: 10
          items:
            type: string
            enum: ['tags:read', 'alarms:read', 'events:emit', 'log']
        configSchema:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [type, description, required]
            properties:
              type:
                type: string
                enum: [string, number, boolean, select]
              description:
                type: string
                maxLength: 500
              default:
                description: string | finite number | boolean
              required:
                type: boolean
              options:
                type: array
                maxItems: 50
                items:
                  type: string
                  maxLength: 256
        dependencies:
          type: object
          additionalProperties:
            type: string
            maxLength: 64
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64
    MarketplaceInstallRequest:
      type: object
      additionalProperties: false
      properties:
        config:
          type: object
          additionalProperties:
            description: string | finite number | boolean
        grants:
          type: array
          maxItems: 10
          items:
            type: string
            enum: ['tags:read', 'alarms:read', 'events:emit', 'log']
    MarketplaceConfigureRequest:
      type: object
      required: [config]
      additionalProperties: false
      properties:
        config:
          type: object
          additionalProperties:
            description: string | finite number | boolean
    MarketplaceInvokeRequest:
      type: object
      additionalProperties: false
      properties:
        input:
          description: Arbitrary plugin input
    MarketplaceErrorBody:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable engine error code (e.g. invalid-request, plugin-not-found)
    NlQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          description: Bounded by maxQueryLength (advertised in every response's limits)
    NlQueryLimits:
      type: object
      properties:
        maxQueryLength:
          type: integer
        queryTimeoutMs:
          type: integer
        maxResolverCandidateTags:
          type: integer
        maxResultItems:
          type: integer
        maxHistoryEntries:
          type: integer
    NlQueryBadRequest:
      type: object
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [invalid_request]
        detail:
          type: string
        limits:
          $ref: '#/components/schemas/NlQueryLimits'
        examples:
          type: array
          items:
            type: string
    IntelligenceRefusal:
      type: object
      required: [error, detail, reference]
      description: Single refusal envelope for every retired/unimplemented route on /api/intelligence
      properties:
        error:
          type: string
          enum: [endpoint_retired, not_implemented]
        detail:
          type: string
        reference:
          type: string
          description: Issue URL recording the retirement decision
        replacement:
          type: object
          description: Present on 410 only
          properties:
            endpoints:
              type: array
              items:
                type: string
            scopes:
              type: array
              items:
                type: string

  parameters:
    TuningLoopId:
      name: loopId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
    TuningProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
    MarketplacePluginId:
      name: pluginId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{1,63}$'
  securitySchemes:
    ControlPlaneApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Control-plane API key (#576 pattern). Each operation names the scope it
        requires (e.g. tuning.read, marketplace.install, nlquery.read); the
        central inventory is server/middleware/control-route-policy.ts.
