  # ── Intelligence (ADR-0013 [13.5], #216) — mounted at /api/intelligence ────
  # POST /nlquery and GET /nlquery/history are the implemented surface
  # (scope nlquery.read — a READ scope; the POST is transport-only). Every
  # other route on this router refuses with the machine-readable 410/501
  # envelope (endpoint_retired / not_implemented) rather than proxying around
  # the fine-grained scopes of the real routers.
  /api/intelligence/nlquery:
    post:
      tags: [Intelligence]
      summary: Ask a bounded natural-language question over live SCADA data
      description: |
        Requires control-plane scope `nlquery.read` (a READ scope — POST is for
        transport only, so the question stays out of URLs and access logs; the
        route mutates nothing). Execution is bounded: input length, wall-clock
        timeout, resolver-candidate and result caps — every response advertises
        the bounds that shaped it. Over-long input is rejected (400), never
        truncated. Contract: docs/adr/ADR-0027-nl-query-read-scope-and-bounds.md.
      security:
        - ControlPlaneApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NlQueryRequest'
      responses:
        '200':
          description: Query result with the advertised bounds
          content:
            application/json:
              schema:
                type: object
                description: 'Engine result plus limits and historyPersistence: process-local'
                additionalProperties: true
        '400':
          description: 'Invalid or over-long query (error: invalid_request, with limits and examples)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NlQueryBadRequest'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
  /api/intelligence/nlquery/history:
    get:
      tags: [Intelligence]
      summary: Read recent NL query history (process-local ring buffer)
      description: |
        Requires control-plane scope `nlquery.read`. History is a bounded
        in-process ring buffer — lost on restart, not shared across replicas,
        and NOT a durable audit trail; the response says so explicitly.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Recent history with persistence contract
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  count:
                    type: integer
                  persistence:
                    type: string
                    enum: [process-local]
                  persistenceNote:
                    type: string
                  limits:
                    $ref: '#/components/schemas/NlQueryLimits'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NlQueryBadRequest'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
  /api/intelligence/maintenance/analyze:
    post:
      tags: [Intelligence]
      summary: 'RETIRED: use /api/predictive (410 Gone)'
      description: |
        Always returns 410 with the refusal envelope. The capability lives on
        /api/predictive (#212) behind predictive.* scopes; the body lists the
        replacement endpoints and scopes.
      responses:
        '410':
          $ref: '#/components/responses/IntelligenceRetired'
  /api/intelligence/maintenance/insights/{assetId}:
