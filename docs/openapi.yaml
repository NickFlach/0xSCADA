  /api/v2/events/batches:
    get:
      tags: [Events v2]
      summary: List event batches
      operationId: getEventBatches
      parameters:
        - name: siteId
          in: query
          schema:
            type: string
        - name: anchorStatus
          in: query
          schema:
            $ref: '#/components/schemas/AnchorStatus'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of event batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventBatch'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/events/batches/{id}:
    get:
      tags: [Events v2]
      summary: Get batch with events
      operationId: getBatchById
      parameters:
        - name: id
          in: path
