components:
  responses:
    ControlPlaneUnauthorized:
      description: Missing or invalid X-API-Key
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ControlPlaneForbidden:
      description: The key lacks the control-plane scope this route requires
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    TuningBadRequest:
      description: Request body or query failed strict zod validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TuningError'
    TuningNotFound:
      description: Loop or proposal not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TuningError'
    TuningGateUnavailable:
      description: The approval gate or audit store is unconfigured/unavailable (fail-closed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TuningError'
    MarketplaceError:
      description: Engine-declared failure with machine-readable code
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarketplaceErrorBody'
    IntelligenceRetired:
      description: 'endpoint_retired: the capability lives on another, scope-guarded router'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntelligenceRefusal'
    IntelligenceNotImplemented:
      description: 'not_implemented: no implementation exists on main'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntelligenceRefusal'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # Common
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object

    # Health
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        uptime:
          type: number
        components:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  enum: [up, down]
                latencyMs:
                  type: number
            blockchain:
              type: object
              properties:
                status:
                  type: string
                  enum: [up, down, unknown]

    # Enums
    EventType:
      type: string
      enum: [TELEMETRY, ALARM, COMMAND, ACKNOWLEDGEMENT, MAINTENANCE, BLUEPRINT_CHANGE, CODE_GENERATION, DEPLOYMENT_INTENT]

    OriginType:
      type: string
      enum: [GATEWAY, USER, AGENT, SYSTEM]

    AnchorStatus:
      type: string
      enum: [PENDING, BATCHED, ANCHORED, FAILED]

    # Sites
    Site:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        owner:
          type: string
        status:
          type: string
        ethereumAddress:
          type: string
        authorizedGateways:
          type: array
          items:
            type: string
        authorizedSigners:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSiteRequest:
      type: object
      required: [name, location, owner]
      properties:
        name:
          type: string
        location:
          type: string
        owner:
          type: string
        ethereumAddress:
          type: string
        authorizedGateways:
          type: array
          items:
            type: string
        authorizedSigners:
          type: array
          items:
            type: string

    # Assets
    Asset:
      type: object
      properties:
        id:
          type: string
        siteId:
          type: string
        assetType:
          type: string
        nameOrTag:
          type: string
        critical:
          type: boolean
        metadata:
          type: object
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateAssetRequest:
      type: object
      required: [siteId, assetType, nameOrTag]
      properties:
        siteId:
          type: string
        assetType:
          type: string
        nameOrTag:
          type: string
        critical:
          type: boolean
          default: false
        metadata:
          type: object

    # Events (Legacy)
    EventAnchor:
      type: object
      properties:
        id:
          type: string
        assetId:
          type: string
        eventType:
          type: string
        payloadHash:
          type: string
        timestamp:
          type: string
          format: date-time
        recordedBy:
          type: string
        txHash:
          type: string
        details:
          type: string
        fullPayload:
          type: object

    PaginatedEvents:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventAnchor'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean
        nextPage:
          type: integer
          nullable: true
        prevPage:
          type: integer
          nullable: true

    CreateEventRequest:
      type: object
      required: [assetId, eventType, payload]
      properties:
        assetId:
          type: string
        eventType:
          type: string
        payload:
          type: object
        details:
          type: string
        recordedBy:
          type: string

    # Events v2
    EventV2:
      type: object
      properties:
        id:
          type: string
        eventType:
          $ref: '#/components/schemas/EventType'
        siteId:
          type: string
        assetId:
          type: string
        sourceTimestamp:
          type: string
          format: date-time
        receiptTimestamp:
          type: string
          format: date-time
        originType:
          $ref: '#/components/schemas/OriginType'
        originId:
          type: string
        payload:
          type: object
        details:
          type: string
        signature:
          type: string
        hash:
          type: string
        anchorStatus:
          $ref: '#/components/schemas/AnchorStatus'
        batchId:
          type: string
        merkleIndex:
          type: integer
        merkleProof:
          type: array
          items:
            type: string
        anchorTxHash:
          type: string
        anchoredAt:
          type: string
          format: date-time

    EventsV2Response:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventV2'
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            count:
              type: integer

    EventV2Detail:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/EventV2'
        batch:
          $ref: '#/components/schemas/EventBatch'
        verification:
          type: object
          properties:
            hash:
              type: string
            signature:
              type: string
            anchorStatus:
              $ref: '#/components/schemas/AnchorStatus'
            merkleProof:
              type: array
              items:
                type: string
            anchorTxHash:
              type: string

    EventVerification:
      type: object
      properties:
        eventId:
          type: string
        valid:
          type: boolean
        computedHash:
          type: string
        storedHash:
          type: string
        merkleRoot:
          type: string
        anchorTxHash:
          type: string
        anchoredAt:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            hashValid:
              type: boolean
            signaturePresent:
              type: boolean
            merkleProofValid:
              type: boolean
            anchored:
              type: boolean

    CreateEventV2Request:
      type: object
      required: [eventType, siteId, originType, originId, payload]
      properties:
        eventType:
          $ref: '#/components/schemas/EventType'
        siteId:
          type: string
        assetId:
          type: string
        originType:
          $ref: '#/components/schemas/OriginType'
        originId:
          type: string
        payload:
          type: object
        sourceTimestamp:
          type: string
          format: date-time
        details:
          type: string

    CreateTelemetryEventRequest:
      type: object
      required: [siteId, assetId, originId, tag, value]
      properties:
        siteId:
          type: string
        assetId:
          type: string
        originId:
          type: string
        originType:
          $ref: '#/components/schemas/OriginType'
          default: GATEWAY
        tag:
          type: string
        value:
          oneOf:
            - type: number
            - type: string
        unit:
          type: string
        quality:
          type: string
          default: GOOD

    CreateAlarmEventRequest:
      type: object
      required: [siteId, assetId, originId, alarmId, severity, state, message]
      properties:
        siteId:
          type: string
        assetId:
          type: string
        originId:
          type: string
        originType:
          $ref: '#/components/schemas/OriginType'
        alarmId:
          type: string
        alarmType:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        state:
          type: string
          enum: [ACTIVE, CLEARED, ACKNOWLEDGED]
        message:
          type: string
        value:
          type: number
        limit:
          type: number

    CreateCommandEventRequest:
      type: object
      required: [siteId, assetId, originId, commandType, target]
      properties:
        siteId:
          type: string
        assetId:
          type: string
        originId:
          type: string
        originType:
          $ref: '#/components/schemas/OriginType'
          default: USER
        commandType:
          type: string
        target:
          type: string
        value:
          type: string
        previousValue:
          type: string
        reason:
          type: string

    EventStats:
      type: object
      properties:
        total:
          type: integer
        byType:
          type: object
          additionalProperties:
            type: integer
        byOrigin:
          type: object
          additionalProperties:
            type: integer
        byAnchorStatus:
          type: object
          additionalProperties:
            type: integer
        recentActivity:
          type: object
          properties:
            last24h:
              type: integer
            lastWeek:
              type: integer

    EventTypesMetadata:
      type: object
      properties:
        types:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              description:
                type: string
        origins:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              description:
                type: string
        anchorStatuses:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              description:
                type: string

    # Event Batches
    EventBatch:
      type: object
      properties:
        id:
          type: string
        siteId:
          type: string
        eventCount:
          type: integer
        merkleRoot:
          type: string
        firstEventAt:
          type: string
          format: date-time
        lastEventAt:
          type: string
          format: date-time
        anchorStatus:
          $ref: '#/components/schemas/AnchorStatus'
        txHash:
          type: string
        blockNumber:
          type: integer
        anchoredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    BatchDetail:
      type: object
      properties:
        batch:
          $ref: '#/components/schemas/EventBatch'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventV2'
        verification:
          type: object
          properties:
            merkleRoot:
              type: string
            eventCount:
              type: integer
            anchorStatus:
              $ref: '#/components/schemas/AnchorStatus'
            txHash:
              type: string
            blockNumber:
              type: integer

    AnchorResult:
      type: object
