        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/events/batches/{id}/anchor:
    post:
      tags: [Events v2]
      summary: Manually anchor a batch
      operationId: anchorBatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Anchoring result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # BATCH ANCHORING
  # ============================================================================
  /api/batch/stats:
    get:
      tags: [Batch]
      summary: Get batch anchoring statistics
      operationId: getBatchStats
      responses:
        '200':
          description: Batch service statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStats'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/batch/history:
    get:
      tags: [Batch]
      summary: Get batch history
      operationId: getBatchHistory
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Recent batch history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchHistoryItem'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/batch/pending:
    get:
      tags: [Batch]
      summary: Get pending events
      operationId: getPendingEvents
      responses:
        '200':
          description: Pending events in queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingEvents'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/batch/flush:
    post:
      tags: [Batch]
      summary: Force flush pending events
      operationId: flushBatch
      responses:
        '200':
          description: Flush result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlushResult'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/batch/{batchId}/proof/{eventId}:
    get:
      tags: [Batch]
      summary: Get Merkle proof for event
      operationId: getEventProof
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Merkle proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerkleProof'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/batch/config:
    put:
      tags: [Batch]
      summary: Update batch configuration
      operationId: updateBatchConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchConfigUpdate'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchConfigResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/batch/blob/config:
    get:
      tags: [Batch]
      summary: Get EIP-4844 blob configuration
      operationId: getBlobConfig
      responses:
        '200':
          description: Blob configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobConfig'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Batch]
      summary: Update blob configuration
      operationId: updateBlobConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlobConfigUpdate'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobConfigResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/batch/blob/estimate:
    post:
      tags: [Batch]
      summary: Estimate blob vs calldata costs
      operationId: estimateBlobCost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventCount]
              properties:
                eventCount:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Cost estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobCostEstimate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Blockchain not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # MAINTENANCE
  # ============================================================================
  /api/maintenance:
