      summary: Get blockchain status
      operationId: getBlockchainStatus
      responses:
        '200':
          description: Blockchain connectivity status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean

  # ============================================================================
  # BLUEPRINTS
  # ============================================================================
  /api/blueprints/seed:
    post:
      tags: [Blueprints]
      summary: Seed database with default vendors
      operationId: seedBlueprints
      parameters:
        - name: force
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Seeding result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedResult'
        '500':
