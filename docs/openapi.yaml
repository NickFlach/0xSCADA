# ============================================================================
# COMPONENTS
# ============================================================================
  # ── PID Tuning (ADR-0013 [13.4], #215) — mounted at /api/tuning ────────────
  # Every route requires an explicit control-plane scope via the X-API-Key
  # header: tuning.read (loops/proposals/audit), tuning.write (register,
  # envelopes, tuning studies), tuning.approve (decide a proposal — the only
  # path that can move live gains).
  /api/tuning/loops:
    post:
      tags: [Tuning]
      summary: Register a PID loop (create-only)
      description: |
        Requires control-plane scope `tuning.write`. Create-only — re-registering
        an existing loop returns 409 (`loop-already-registered`), because
        overwriting a live loop is a gain write and gain writes go through the
        approval gate or nowhere.
      security:
        - ControlPlaneApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TuningLoopRegistration'
      responses:
        '201':
          description: Loop registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningLoopSummary'
        '400':
          $ref: '#/components/responses/TuningBadRequest'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
        '409':
          description: 'Loop already registered (reason: loop-already-registered)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningError'
        '422':
          description: 'Initial gains violate the safety envelope (reason: envelope-violation)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningError'
  /api/tuning/loops/{loopId}:
    get:
      tags: [Tuning]
      summary: Read one loop with gains, metrics and envelope
      description: Requires control-plane scope `tuning.read`.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - $ref: '#/components/parameters/TuningLoopId'
      responses:
        '200':
          description: Loop detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningLoopDetail'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
        '404':
          $ref: '#/components/responses/TuningNotFound'
  /api/tuning/loops/{loopId}/envelope:
    put:
      tags: [Tuning]
      summary: Replace a loop's gain safety envelope
      description: Requires control-plane scope `tuning.write`.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - $ref: '#/components/parameters/TuningLoopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TuningEnvelope'
      responses:
        '200':
          description: Envelope applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningEnvelope'
        '400':
          $ref: '#/components/responses/TuningBadRequest'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
        '404':
          $ref: '#/components/responses/TuningNotFound'
  /api/tuning/loops/{loopId}/tune/relay:
    post:
      tags: [Tuning]
      summary: Run a relay-feedback tuning study (simulation) and file a proposal
      description: |
        Requires control-plane scope `tuning.write`. Simulation-based; the
        result is an approval-gated proposal, never a live gain change.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - $ref: '#/components/parameters/TuningLoopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TuningRelayRequest'
      responses:
        '201':
          description: Proposal filed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningProposal'
        '400':
          $ref: '#/components/responses/TuningBadRequest'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
        '404':
          $ref: '#/components/responses/TuningNotFound'
        '503':
          $ref: '#/components/responses/TuningGateUnavailable'
  /api/tuning/loops/{loopId}/tune/cohen-coon:
    post:
      tags: [Tuning]
      summary: Run a Cohen-Coon tuning study (simulation) and file a proposal
      description: Requires control-plane scope `tuning.write`.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - $ref: '#/components/parameters/TuningLoopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TuningCohenCoonRequest'
      responses:
        '201':
          description: Proposal filed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningProposal'
        '400':
          $ref: '#/components/responses/TuningBadRequest'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
        '404':
          $ref: '#/components/responses/TuningNotFound'
        '503':
          $ref: '#/components/responses/TuningGateUnavailable'
  /api/tuning/loops/{loopId}/tune/rl:
    post:
      tags: [Tuning]
      summary: Run a reinforcement-learning tuning study (simulation) and file a proposal
      description: Requires control-plane scope `tuning.write`.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - $ref: '#/components/parameters/TuningLoopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TuningRLRequest'
      responses:
        '201':
          description: Proposal filed with the training outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:
                    $ref: '#/components/schemas/TuningProposal'
                  outcome:
                    type: object
                    description: RL training outcome summary
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/TuningBadRequest'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
        '404':
          $ref: '#/components/responses/TuningNotFound'
        '503':
          $ref: '#/components/responses/TuningGateUnavailable'
  /api/tuning/proposals:
    get:
      tags: [Tuning]
      summary: List tuning proposals
      description: Requires control-plane scope `tuning.read`.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, applied, rejected, expired, failed]
        - name: loopId
          in: query
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Proposals matching the filter
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items:
                      $ref: '#/components/schemas/TuningProposal'
        '400':
          $ref: '#/components/responses/TuningBadRequest'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
  /api/tuning/proposals/{proposalId}:
    get:
      tags: [Tuning]
      summary: Read one proposal
      description: Requires control-plane scope `tuning.read`.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - $ref: '#/components/parameters/TuningProposalId'
      responses:
        '200':
          description: The proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningProposal'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
        '404':
          $ref: '#/components/responses/TuningNotFound'
  /api/tuning/proposals/{proposalId}/approve:
    post:
      tags: [Tuning]
      summary: Approve a proposal (the only path that can move live gains)
      description: |
        Requires control-plane scope `tuning.approve`. The approver identity is
        the authenticated principal; decision bodies are strict, so a
        caller-supplied `approver` field is rejected with 400 rather than
        silently ignored.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - $ref: '#/components/parameters/TuningProposalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TuningDecision'
      responses:
        '200':
          description: Decided proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningProposal'
        '400':
          $ref: '#/components/responses/TuningBadRequest'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          description: Denied by the approval policy (`reason` field explains)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningError'
        '404':
          $ref: '#/components/responses/TuningNotFound'
        '409':
          description: Proposal already decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningError'
        '422':
          description: 'Proposed gains violate the safety envelope (reason: envelope-violation)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningError'
        '503':
          $ref: '#/components/responses/TuningGateUnavailable'
  /api/tuning/proposals/{proposalId}/reject:
    post:
      tags: [Tuning]
      summary: Reject a proposal
      description: Requires control-plane scope `tuning.approve`.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - $ref: '#/components/parameters/TuningProposalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TuningDecision'
      responses:
        '200':
          description: Decided proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningProposal'
        '400':
          $ref: '#/components/responses/TuningBadRequest'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
        '404':
          $ref: '#/components/responses/TuningNotFound'
        '409':
          description: Proposal already decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningError'
  /api/tuning/audit:
    get:
      tags: [Tuning]
      summary: Read the durable tuning audit trail
      description: Requires control-plane scope `tuning.read`.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - name: proposalId
          in: query
          schema:
            type: string
            maxLength: 128
        - name: loopId
          in: query
          schema:
            type: string
            maxLength: 128
        - name: decision
          in: query
          schema:
            type: string
            enum: [proposed, envelope-rejected, approved, applied, rejected, denied, expired, failed]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Matching audit records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      description: Tuning audit record (shared/types/tuning)
                      additionalProperties: true
        '400':
          $ref: '#/components/responses/TuningBadRequest'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
        '503':
          description: 'Audit store unavailable (reason: audit-store-unavailable)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuningError'
  /api/tuning/status:
    get:
      tags: [Tuning]
      summary: Tuning service health
      description: Requires control-plane scope `tuning.read`.
      security:
        - ControlPlaneApiKey: []
      responses:
        '200':
          description: Service health report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'

  # ── Agent Marketplace (ADR-0013 [13.6], #217) — mounted at /api/marketplace ─
  # Scopes: marketplace.read (registry/health), marketplace.publish,
  # marketplace.install (install + lifecycle transitions), marketplace.invoke,
  # marketplace.uninstall. Errors use the engine-declared envelope
  # { error, code } with the engine's own HTTP status.
  /api/marketplace/plugins:
    get:
      tags: [Marketplace]
      summary: Search the plugin registry
      description: Requires control-plane scope `marketplace.read`.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 256
        - name: category
          in: query
          schema:
            type: string
            enum: [intelligence, integration, reporting, safety, optimization, custom]
      responses:
        '200':
          description: Matching registry entries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/MarketplaceError'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
    post:
      tags: [Marketplace]
      summary: Publish a plugin manifest
      description: |
        Requires control-plane scope `marketplace.publish`. The publisher
        identity comes from the authenticated principal; the manifest schema is
        strict, so a body carrying a `publisher` field is rejected with 400.
      security:
        - ControlPlaneApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceManifest'
      responses:
        '201':
          description: Published registry entry
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/MarketplaceError'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
        '409':
          $ref: '#/components/responses/MarketplaceError'
  /api/marketplace/plugins/{pluginId}:
    get:
      tags: [Marketplace]
      summary: Read one registry entry
      description: Requires control-plane scope `marketplace.read`.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - $ref: '#/components/parameters/MarketplacePluginId'
      responses:
        '200':
          description: Registry entry
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
        '404':
          $ref: '#/components/responses/MarketplaceError'
    delete:
      tags: [Marketplace]
      summary: Uninstall a plugin
      description: Requires control-plane scope `marketplace.uninstall`.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - $ref: '#/components/parameters/MarketplacePluginId'
      responses:
        '200':
          description: Uninstalled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
        '404':
          $ref: '#/components/responses/MarketplaceError'
  /api/marketplace/installed:
    get:
      tags: [Marketplace]
      summary: List installed plugins
      description: Requires control-plane scope `marketplace.read`.
      security:
        - ControlPlaneApiKey: []
      responses:
        '200':
          description: Installed plugins with status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
  /api/marketplace/plugins/{pluginId}/install:
    post:
      tags: [Marketplace]
      summary: Install a published plugin
      description: |
        Requires control-plane scope `marketplace.install`. The installer
        identity comes from the authenticated principal. Capability grants are
        security state and are durable.
      security:
        - ControlPlaneApiKey: []
      parameters:
        - $ref: '#/components/parameters/MarketplacePluginId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceInstallRequest'
      responses:
        '200':
          description: Installed plugin state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/MarketplaceError'
        '401':
          $ref: '#/components/responses/ControlPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/ControlPlaneForbidden'
