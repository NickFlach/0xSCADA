      responses:
        '201':
          description: Command event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventV2'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/events/stats:
    get:
      tags: [Events v2]
      summary: Get event statistics
      operationId: getEventStats
      parameters:
        - name: siteId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Event statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStats'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/events/types:
    get:
      tags: [Events v2]
      summary: Get available event types
      operationId: getEventTypes
      responses:
        '200':
          description: Event type metadata
          content:
