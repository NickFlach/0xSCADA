    post:
      tags: [Blueprints]
      summary: Create control module type
      operationId: createCMType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCMTypeRequest'
      responses:
        '201':
          description: CM type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlModuleType'
        '500':
