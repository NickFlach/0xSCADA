# Forge is the canonical contract test runner: hardhat.config.ts cannot load
# under Hardhat 3 until the package becomes ESM ("type": "module").
[profile.default]
src = "contracts"
test = "contracts/test"
out = "out"
cache_path = "cache_forge"
libs = ["node_modules"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
]
# contracts/test/fuzz imports contracts/SiteRegistry.sol, which no longer
# exists in this repo — those files cannot compile until restored or removed.
skip = ["contracts/test/fuzz/**"]
