# Forge is the canonical contract test runner: hardhat.config.ts cannot load
# under Hardhat 3 until the package becomes ESM ("type": "module").
[profile.default]
src = "contracts"
test = "contracts/test"
out = "out"
cache_path = "cache_forge"
libs = ["node_modules"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
]
# SiteRegistry.fuzz.t.sol imports hardhat/console.sol and contracts/SiteRegistry.sol,
# neither of which exists in this repo — it cannot compile until restored (#490).
# EventAnchor.fuzz.t.sol was rewritten against the real EventAnchor ABI and runs.
skip = ["contracts/test/fuzz/SiteRegistry.fuzz.t.sol"]
