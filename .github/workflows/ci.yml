name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # DCO CHECK (Required for all PRs)
  # ==========================================================================
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check DCO
        run: |
          # Check all commits in the PR for DCO sign-off (excluding merge commits)
          commits=$(git log --format='%H %s' --no-merges origin/${{ github.base_ref }}..HEAD)
          missing_signoff=false

          while IFS= read -r line; do
            if [ -z "$line" ]; then continue; fi
            commit_hash=$(echo "$line" | cut -d' ' -f1)
            commit_msg=$(git log -1 --format='%B' "$commit_hash")
            
            if ! echo "$commit_msg" | grep -q "Signed-off-by:"; then
              echo "❌ Missing DCO sign-off in commit: $commit_hash"
              echo "   Message: $(echo "$line" | cut -d' ' -f2-)"
              missing_signoff=true
            else
              echo "✅ DCO sign-off found in commit: $(echo "$line" | cut -d' ' -f2-)"
            fi
          done <<< "$commits"

          if [ "$missing_signoff" = true ]; then
            echo ""
            echo "=========================================="
            echo "Developer Certificate of Origin (DCO) Check Failed"
            echo "=========================================="
            echo ""
            echo "Please sign off your commits using: git commit --signoff"
            echo "Or amend existing commits: git commit --amend --signoff"
            echo ""
            echo "See: https://developercertificate.org/"
            exit 1
          fi

          echo ""
          echo "✅ All commits have DCO sign-off!"

  # ==========================================================================
  # LINT & TYPE CHECK
  # ==========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (strict on push, advisory on PR)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            set +e
            npm run check > typecheck.log 2>&1
            status=$?
            if [ $status -ne 0 ]; then
              echo "::warning::Type check failed on this PR. Treating as advisory while repo-wide type debt is reduced."
              tail -n 200 typecheck.log || true
            else
              echo "Type check passed."
            fi
          else
            npm run check
          fi

      - name: Run lint script (if present)
        run: |
          if npm run | grep -qE "^  lint$|^  lint:"; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              npm run lint || echo "::warning::Lint script failed on PR (advisory)."
            else
              npm run lint
            fi
          else
            echo "No lint script defined; skipping."
          fi

      - name: Check formatting (if script exists)
        run: |
          if npm run | grep -q " format:check"; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              npm run format:check || echo "::warning::Format check failed on PR (advisory)."
            else
              npm run format:check
            fi
          else
            echo "No format:check script defined; skipping."
          fi

  # ==========================================================================
  # UNIT TESTS
  # ==========================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, dco]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (strict on push, advisory on PR)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm test || echo "::warning::Unit tests failed on PR (advisory)."
          else
            npm test
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  # ==========================================================================
  # BUILD
  # ==========================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ==========================================================================
  # DOCKER BUILD
  # ==========================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: oxscada:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # SECURITY SCAN
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ==========================================================================
  # SMART CONTRACT TESTS (Optional)
  # ==========================================================================
  contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile
        continue-on-error: true
