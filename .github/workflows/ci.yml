name: CI/CD Pipeline

on:
  push:
    branches: [main, 'feat/**', 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 22 ships npm 10.9+, which accepts the package-lock.json format that
  # current npm (and therefore Dependabot) generates. Node 20's bundled npm
  # 10.8.2 rejected those lockfiles with EUSAGE "package.json and
  # package-lock.json are in sync", so every Dependabot PR failed at `npm ci`
  # and needed a manual `npx npm@10.8.2 install --package-lock-only` rebase.
  # Keep every CI setup-node pin in this repo on the same major (see
  # test/ci/workflow-node-version.test.ts).
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/0xscada

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present || echo "No lint script defined"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --coverage --passWithNoTests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Enforce npm audit (high and critical)
        run: npm audit --audit-level=high

  blueprint-runtime-arm:
    name: Blueprint Runtime ARM p99 + allocation (constrained proxy)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Assert the constrained ARM shape and gate the runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --cpuset-cpus 0 \
            --memory 6g \
            --memory-swap 6g \
            --network none \
            --pids-limit 128 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
            --workdir /workspace \
            node:20-bookworm-slim \
            sh -euc '
              arch="$(node -p "process.arch")"
              node_major="$(node -p "process.versions.node.split(\".\")[0]")"
              cpus="$(node -p "require(\"node:os\").availableParallelism()")"
              memory_limit="$(cat /sys/fs/cgroup/memory.max)"
              printf "constrained ARM proxy: arch=%s node=%s cpus=%s memory.max=%s\n" \
                "$arch" "$node_major" "$cpus" "$memory_limit"
              test "$arch" = "arm64"
              test "$node_major" = "20"
              test "$cpus" = "1"
              test "$memory_limit" = "6442450944"
              gc_type="$(node --expose-gc -p "typeof globalThis.gc")"
              test "$gc_type" = "function"
              node --expose-gc \
                node_modules/vitest/vitest.mjs run \
                server/blueprint/__tests__/runtime.test.ts
              node --expose-gc --max-semi-space-size=1 --import tsx \
                bench/blueprint-runtime/allocation.bench.ts
              node --expose-gc --import tsx \
                bench/blueprint-runtime/locked.bench.ts
            ' 2>&1 | tee blueprint-runtime-arm-gate.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blueprint-runtime-arm-gate-${{ github.sha }}
          path: blueprint-runtime-arm-gate.txt
          if-no-files-found: error
          retention-days: 30

  helm-gateway:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - run: npm ci
      - name: Register the simple chart dependency repository
        run: helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
      - name: Build, lint, package, and verify Helm charts
        run: >-
          npx vitest run
          gateway/helm-chart.test.ts
          gateway/full-stack-helm-chart.test.ts
        env:
          RUN_HELM_RENDER_TEST: '1'

  docker:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service: [server, client, gateway, validator]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oxscada_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration --if-present
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/oxscada_test
          NODE_ENV: test

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy via kubectl (if configured)
        if: env.KUBE_CONFIG != ''
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          
          # Update image tags in k8s manifests
          for svc in server client gateway validator; do
            if [ -f "k8s/staging/${svc}.yaml" ]; then
              sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/staging/${svc}.yaml
              kubectl apply -f k8s/staging/${svc}.yaml
            fi
          done
          
          # Or use Helm if chart exists
          if [ -d "helm/0xscada" ]; then
            helm upgrade --install 0xscada-staging helm/0xscada \
              --namespace staging --create-namespace \
              --set image.tag=${{ github.sha }} \
              --set env=staging \
              --wait --timeout 300s
          fi
          
          rm /tmp/kubeconfig

      - name: Deploy via Docker Compose (fallback)
        if: env.KUBE_CONFIG == '' && env.STAGING_SSH_KEY != ''
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
        run: |
          echo "Docker Compose deploy to ${STAGING_HOST}"
          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          
          # Copy compose file and deploy
          scp -o StrictHostKeyChecking=no -i ~/.ssh/staging_key \
            docker-compose.yml "${STAGING_HOST}:~/0xscada/"
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/staging_key "${STAGING_HOST}" \
            "cd ~/0xscada && IMAGE_TAG=${{ github.sha }} docker compose pull && docker compose up -d"
          
          rm ~/.ssh/staging_key

      - name: Smoke test staging
        if: vars.STAGING_URL != ''
        run: |
          echo "Waiting for staging to be ready..."
          for i in $(seq 1 30); do
            if curl -sf "${{ vars.STAGING_URL }}/api/health" > /dev/null 2>&1; then
              echo "✅ Staging is healthy"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done
          echo "⚠️ Staging health check timed out (non-blocking)"

  # Summary job for branch protection
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, blueprint-runtime-arm, helm-gateway, test, build, integration-test]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.blueprint-runtime-arm.result }}" != "success" ] || \
             [ "${{ needs.helm-gateway.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.integration-test.result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
