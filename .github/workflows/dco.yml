name: DCO

# Enforces the Developer Certificate of Origin: every non-merge commit in a
# PR must carry a `Signed-off-by: Name <email>` trailer whose name+email
# match the commit author. See CONTRIBUTING.md. Fix an existing branch with
#   git rebase --signoff <base>   (then force-push)
#
# Self-contained — no external app or action. Runs on pull_request so it
# never sees repository secrets (it only reads commit metadata).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off (DCO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          # Automated repo-sync PRs carry already-integrated upstream work,
          # not new contributions, and are exempt (see the sync-from-*.yml
          # workflows). Exit 0 so this required check still reports success.
          case "$HEAD_REF" in
            sync/*)
              echo "Sync PR ($HEAD_REF) — DCO check exempt (integration, not a new contribution)."
              exit 0
              ;;
          esac

          # Non-merge commits introduced by this PR (merge commits are created
          # by GitHub, not the contributor, and are exempt).
          mapfile -t COMMITS < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")

          if [ "${#COMMITS[@]}" -eq 0 ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          fail=0
          for sha in "${COMMITS[@]}"; do
            author_name=$(git show -s --format='%an' "$sha")
            author_email=$(git show -s --format='%ae' "$sha")
            subject=$(git show -s --format='%s' "$sha")
            expected="Signed-off-by: ${author_name} <${author_email}>"

            # Match the trailer case-insensitively on the label, exactly on the
            # name+email. A commit may carry several sign-offs (co-authors); at
            # least one must be the author's.
            if git show -s --format='%B' "$sha" \
                 | grep -iqF "$expected"; then
              echo "PASS  ${sha:0:9}  $subject"
            else
              echo "FAIL  ${sha:0:9}  $subject"
              echo "        missing: $expected"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "::error::One or more commits are not signed off (DCO)."
            echo "Sign new commits with 'git commit -s'. To sign off an existing"
            echo "branch: 'git rebase --signoff ${BASE_SHA:0:9}' then force-push."
            echo "The sign-off name and email must match the commit author."
            exit 1
          fi

          echo ""
          echo "All ${#COMMITS[@]} commit(s) signed off."
