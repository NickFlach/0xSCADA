name: Branch Protection Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  branch-protection:
    name: Branch Protection Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR requirements
        run: |
          echo "Checking PR requirements for main branch..."

          # Check if PR has description.
          # Use a quoted heredoc so markdown backticks are treated as plain text.
          PR_BODY="$(cat <<'EOF'
${{ github.event.pull_request.body }}
EOF
)"

          if [ -z "$(echo "$PR_BODY" | tr -d '[:space:]')" ]; then
            echo "ERROR: PR must have a description"
            exit 1
          fi

          # Check if PR is not a draft
          if [ "${{ github.event.pull_request.draft }}" == "true" ]; then
            echo "ERROR: PR cannot be in draft state for main branch"
            exit 1
          fi

          echo "OK: PR requirements validated"

  required-checks:
    name: Required Status Checks
    runs-on: ubuntu-latest
    # Allow workflow to proceed even if some checks are still pending
    continue-on-error: true
    steps:
      - name: Wait for required checks
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          wait-interval: 10
          check-regexp: '^(Lint|Tests|Build).*'
          allowed-conclusions: success,skipped

  size-limit:
    name: PR Size Limit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          # Get the number of changed lines
          CHANGED_LINES=$(git diff --stat HEAD~1 HEAD | tail -n1 | awk '{print $4}')

          # Warn if PR is too large (>1000 lines)
          if [ "$CHANGED_LINES" -gt 1000 ]; then
            echo "WARNING: PR is large ($CHANGED_LINES lines). Consider splitting into smaller PRs."
          fi

          echo "INFO: PR size: $CHANGED_LINES lines changed"

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    # Conventional commits are recommended but not blocking
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          # Get all non-merge commits introduced by this PR
          COMMITS=$(git log --format=%s --no-merges origin/main..HEAD)
          CONVENTIONAL_REGEX='^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([^)]+\))?: .+$'

          # Check each commit message follows conventional commits
          while IFS= read -r commit; do
            if [ -z "$commit" ]; then
              continue
            fi

            if [[ ! "$commit" =~ $CONVENTIONAL_REGEX ]]; then
              echo "ERROR: Commit message does not follow conventional commits: $commit"
              echo "Expected format: type(scope): description"
              exit 1
            fi
          done <<< "$COMMITS"

          echo "OK: All commit messages follow conventional commits"