# Default deny all ingress in oxscada namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: oxscada
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow ingress to server from client and gateway only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-server-ingress
  namespace: oxscada
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oxscada-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oxscada-client
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oxscada-gateway
        - namespaceSelector:
            matchLabels:
              oxscada.io/component: protocols
      ports:
        - port: 5000
          protocol: TCP
---
# Allow ingress to postgresql from server only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql-ingress
  namespace: oxscada
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oxscada-server
      ports:
        - port: 5432
          protocol: TCP
---
# Allow ingress to client from ingress controller only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-ingress
  namespace: oxscada
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oxscada-client
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 80
          protocol: TCP
---
# Allow ingress to gateway from ingress controller only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: oxscada
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oxscada-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
---
# Default deny all in protocols namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: oxscada-protocols
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow protocol pods to talk to server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-protocol-egress-to-server
  namespace: oxscada-protocols
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oxscada
          podSelector:
            matchLabels:
              app.kubernetes.io/name: oxscada-server
      ports:
        - port: 5000
          protocol: TCP
    - to:  # Allow DNS
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
