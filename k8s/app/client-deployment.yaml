apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxscada-client
  namespace: oxscada
  labels:
    app.kubernetes.io/name: oxscada-client
    app.kubernetes.io/component: client
    app.kubernetes.io/part-of: oxscada
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oxscada-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oxscada-client
        app.kubernetes.io/component: client
        app.kubernetes.io/part-of: oxscada
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: ghcr.io/nickflach/oxscada-client:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: oxscada-client
  namespace: oxscada
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: oxscada-client
