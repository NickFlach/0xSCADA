apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxscada-gateway
  namespace: oxscada
  labels:
    app.kubernetes.io/name: oxscada-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: oxscada
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oxscada-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oxscada-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: oxscada
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: oxscada-app
      containers:
        - name: gateway
          image: ghcr.io/nickflach/oxscada-gateway:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: SERVER_URL
              value: http://oxscada-server:5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: oxscada-gateway
  namespace: oxscada
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: oxscada-gateway
