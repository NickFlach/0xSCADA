apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxscada-server
  namespace: oxscada
  labels:
    app.kubernetes.io/name: oxscada-server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: oxscada
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oxscada-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oxscada-server
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: oxscada
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: oxscada-app
      containers:
        - name: server
          image: ghcr.io/nickflach/oxscada-server:latest
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - secretRef:
                name: postgresql-credentials
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: oxscada-server
  namespace: oxscada
  labels:
    app.kubernetes.io/name: oxscada-server
    app.kubernetes.io/part-of: oxscada
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app.kubernetes.io/name: oxscada-server
