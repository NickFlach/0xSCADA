apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: blockchain-validator
  namespace: oxscada-blockchain
  labels:
    app.kubernetes.io/name: blockchain-validator
    app.kubernetes.io/component: blockchain
    app.kubernetes.io/part-of: oxscada
spec:
  serviceName: blockchain-validator
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: blockchain-validator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blockchain-validator
        app.kubernetes.io/component: blockchain
        app.kubernetes.io/part-of: oxscada
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: validator
          image: ghcr.io/nickflach/oxscada-validator:latest
          ports:
            - containerPort: 8545
              name: rpc
            - containerPort: 30303
              name: p2p
          env:
            - name: NODE_ENV
              value: production
            - name: VALIDATOR_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: chain-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 8545
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8545
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: chain-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
