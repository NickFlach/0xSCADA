apiVersion: v1
kind: Service
metadata:
  name: blockchain-validator
  namespace: oxscada-blockchain
  labels:
    app.kubernetes.io/name: blockchain-validator
    app.kubernetes.io/part-of: oxscada
spec:
  type: ClusterIP
  ports:
    - port: 8545
      targetPort: 8545
      name: rpc
    - port: 30303
      targetPort: 30303
      name: p2p
  selector:
    app.kubernetes.io/name: blockchain-validator
---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: blockchain-validator-headless
  namespace: oxscada-blockchain
spec:
  clusterIP: None
  ports:
    - port: 8545
      name: rpc
    - port: 30303
      name: p2p
  selector:
    app.kubernetes.io/name: blockchain-validator
