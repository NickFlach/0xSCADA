apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oxscada
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: oxscada
  source:
    repoURL: https://github.com/NickFlach/0xSCADA.git
    targetRevision: main
    path: helm/oxscada
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: oxscada
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
