# 0xSCADA Kubernetes Cluster Bootstrap Configuration
# Supports both kind (development) and k3s (production edge)
---
# KIND cluster configuration (development/testing)
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: oxscada-dev
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
  - role: worker
    labels:
      oxscada.io/role: application
  - role: worker
    labels:
      oxscada.io/role: database
  - role: worker
    labels:
      oxscada.io/role: protocol
    extraMounts:
      - hostPath: /dev
        containerPath: /dev
---
