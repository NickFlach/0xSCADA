apiVersion: v1
kind: ResourceQuota
metadata:
  name: oxscada-quota
  namespace: oxscada
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "10"
    services: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: oxscada-protocols-quota
  namespace: oxscada-protocols
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "10"
    services: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: oxscada-blockchain-quota
  namespace: oxscada-blockchain
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "5"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: oxscada-limits
  namespace: oxscada
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
