apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oxscada-ingress
  namespace: oxscada
  labels:
    app.kubernetes.io/part-of: oxscada
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: "oxscada-server"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - oxscada.example.com
        - api.oxscada.example.com
      secretName: oxscada-tls
  rules:
    - host: oxscada.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oxscada-client
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: oxscada-server
                port:
                  number: 5000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: oxscada-server
                port:
                  number: 5000
    - host: api.oxscada.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oxscada-gateway
                port:
                  number: 8080
