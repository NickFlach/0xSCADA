# 0xSCADA Full Stack Helm Values

global:
  namespace: oxscada
  imagePullPolicy: IfNotPresent
  imageRegistry: ghcr.io/nickflach/0xscada

# ─── Server ────────────────────────────────────────────────────────────────
server:
  enabled: true
  replicaCount: 2
  image:
    repository: "{{ .Values.global.imageRegistry }}/server"
    tag: latest
  port: 3000
  apiKeys:
    # API_KEYS is read from this pre-created Secret; the chart never generates
    # or stores an API credential. Leave empty only if control-plane access is
    # intentionally unavailable.
    existingSecret: ""
    secretKey: API_KEYS
    # Enables API key authentication for the entire API gateway. Control-plane
    # routes require API_KEYS independently of this setting.
    enableGlobalAuth: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    NODE_ENV: production
    DATABASE_URL: "postgresql://oxscada:oxscada@postgresql:5432/oxscada"

# ─── Client ────────────────────────────────────────────────────────────────
client:
  enabled: true
  replicaCount: 2
  image:
    repository: "{{ .Values.global.imageRegistry }}/client"
    tag: latest
  port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ─── Gateway ───────────────────────────────────────────────────────────────
gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: "{{ .Values.global.imageRegistry }}/gateway"
    tag: latest
  port: 8080
  # Optional fixed upstream origin. When empty, the chart targets its server
  # Service at http://<release>-server:<server.port>.
  serverUrl: ""
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─── Blockchain (Hardhat/Geth fork) ───────────────────────────────────────
blockchain:
  enabled: true
  replicaCount: 1
  image:
    repository: "{{ .Values.global.imageRegistry }}/blockchain"
    tag: latest
  ports:
    rpc: 8545
    ws: 8546
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

# ─── Observability (Prometheus + Grafana) ──────────────────────────────────
observability:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
    retention: 15d
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
  grafana:
    enabled: true
    port: 3001
    adminPassword: admin
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

# ─── Ingress ───────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: oxscada.local
      paths:
        - path: /
          service: client
        - path: /api
          service: server
        - path: /gateway
          service: gateway

# ─── PostgreSQL ────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    username: oxscada
    password: oxscada
    database: oxscada
  primary:
    persistence:
      size: 5Gi
