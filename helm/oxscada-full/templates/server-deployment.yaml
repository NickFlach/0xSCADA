{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oxscada-full.fullname" . }}-server
  labels:
    {{- include "oxscada-full.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "oxscada-full.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oxscada-full.selectorLabels" (dict "root" . "component" "server") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.server.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: {{ include "oxscada-full.image" (list . .Values.server.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.server.port | quote }}
            - name: OXSCADA_REPLICA_COUNT
              value: {{ .Values.server.replicaCount | quote }}
            - name: ENABLE_API_KEYS
              value: {{ .Values.server.apiKeys.enableGlobalAuth | quote }}
            {{- with .Values.server.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.server.database.secretKey | quote }}
            {{- end }}
            {{- if .Values.server.apiKeys.enableGlobalAuth }}
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ required "server.apiKeys.existingSecret is required when API-key authentication is enabled" .Values.server.apiKeys.existingSecret | quote }}
                  key: {{ $.Values.server.apiKeys.secretKey | quote }}
            {{- else }}
            {{- with .Values.server.apiKeys.existingSecret }}
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.server.apiKeys.secretKey | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.blockchain.enabled }}
            - name: BLOCKCHAIN_RPC_URL
              value: {{ printf "http://%s-blockchain:%v" (include "oxscada-full.fullname" .) .Values.blockchain.ports.rpc | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.server.securityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/healthz
              port: {{ .Values.server.port }}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: {{ .Values.server.port }}
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: {{ .Values.server.port }}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oxscada-full.fullname" . }}-server
  labels:
    {{- include "oxscada-full.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    {{- include "oxscada-full.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
{{- end }}
