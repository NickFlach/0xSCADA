{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oxscada-full.fullname" . }}-server
  labels:
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: "{{ .Values.global.imageRegistry }}/server:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
          env:
            - name: NODE_ENV
              value: {{ .Values.server.env.NODE_ENV }}
            - name: DATABASE_URL
              value: {{ .Values.server.env.DATABASE_URL }}
            - name: PORT
              value: "{{ .Values.server.port }}"
            - name: OXSCADA_REPLICA_COUNT
              value: "{{ .Values.server.replicaCount }}"
            - name: ENABLE_API_KEYS
              value: {{ .Values.server.apiKeys.enableGlobalAuth | quote }}
            {{- with .Values.server.apiKeys.existingSecret }}
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.server.apiKeys.secretKey | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oxscada-full.fullname" . }}-server
spec:
  selector:
    app.kubernetes.io/component: server
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
{{- end }}
