{{- if .Values.client.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oxscada-full.fullname" . }}-client
  labels:
    app.kubernetes.io/component: client
spec:
  replicas: {{ .Values.client.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: client
  template:
    metadata:
      labels:
        app.kubernetes.io/component: client
    spec:
      containers:
        - name: client
          image: "{{ .Values.global.imageRegistry }}/client:{{ .Values.client.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.client.port }}
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oxscada-full.fullname" . }}-client
spec:
  selector:
    app.kubernetes.io/component: client
  ports:
    - port: {{ .Values.client.port }}
      targetPort: {{ .Values.client.port }}
{{- end }}
