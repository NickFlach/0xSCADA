apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  labels:
    app.kubernetes.io/part-of: oxscada
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_PASSWORD: {{ randAlphaNum 32 | quote }}
