{{- range $name, $component := dict "server" .Values.server "client" .Values.client "gateway" .Values.gateway }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxscada-{{ $name }}
  labels:
    app.kubernetes.io/name: oxscada-{{ $name }}
    app.kubernetes.io/component: {{ $name }}
    app.kubernetes.io/part-of: oxscada
    helm.sh/chart: {{ include "oxscada.chart" $ }}
spec:
  replicas: {{ $component.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: oxscada-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oxscada-{{ $name }}
        app.kubernetes.io/component: {{ $name }}
        app.kubernetes.io/part-of: oxscada
    spec:
      securityContext:
        {{- toYaml $.Values.securityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $component.image.repository }}:{{ $component.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $component.port }}
              name: http
          {{ if eq $name "server" }}
          env:
            - name: OXSCADA_REPLICA_COUNT
              value: "{{ $component.replicaCount }}"
            - name: ENABLE_API_KEYS
              value: {{ $component.apiKeys.enableGlobalAuth | quote }}
            {{- with $component.apiKeys.existingSecret }}
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $component.apiKeys.secretKey | quote }}
            {{- end }}
          {{ else if eq $name "gateway" }}
          env:
            - name: PORT
              value: {{ $component.port | quote }}
            - name: SERVER_URL
              value: {{ default (printf "http://oxscada-server:%v" $.Values.server.port) $component.serverUrl | quote }}
          {{ end }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $component.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ if eq $name "gateway" }}/readyz{{ else }}/health{{ end }}
              port: {{ $component.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
{{- end }}
